<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">&#8595;</div>
      <h1>Suno Downloader</h1>
    </header>

    <div id="status-msg" class="status-msg"></div>
    <div id="song-count" class="song-count"></div>

    <div class="actions">
      <button id="btn-load"     class="btn secondary">&#8635; Load All Songs</button>
      <button id="btn-download" class="btn primary"   disabled>&#8595; Download All as WAV</button>
      <button id="btn-stop"     class="btn danger"    hidden>&#9632; Stop</button>
    </div>

    <div id="progress-section" hidden>
      <div id="progress-title" class="progress-title"></div>
      <div class="bar-track">
        <div id="bar-fill" class="bar-fill"></div>
      </div>
      <div id="progress-sub" class="progress-sub"></div>
    </div>

    <div id="done-msg"    class="done-msg"    hidden></div>
    <div id="errors-list" class="errors-list" hidden></div>

    <p class="footer-hint">
      Browse your Suno workspace first, then click <strong>Load All Songs</strong>.
      Files save to <code>Downloads/suno-downloads/</code>.
    </p>

  </div>
  <script src="popup.js"></script>
</body>
</html>
