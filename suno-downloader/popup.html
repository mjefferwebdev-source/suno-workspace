<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <header>
      <div class="logo">&#8595;</div>
      <h1>Suno Downloader</h1>
    </header>

    <!-- ── View 1: workspace picker ── -->
    <section id="view-workspaces">
      <p class="view-label">Choose a workspace to download:</p>
      <div id="workspace-list"></div>
      <p id="hint" class="hint hidden"></p>
    </section>

    <!-- ── View 2: download progress ── -->
    <section id="view-download" class="hidden">
      <div id="dl-workspace" class="dl-workspace"></div>

      <div id="dl-status" class="dl-status"></div>

      <div class="bar-track">
        <div id="bar-fill" class="bar-fill"></div>
      </div>
      <div id="dl-sub" class="dl-sub"></div>

      <div id="dl-done" class="dl-done hidden"></div>
      <div id="dl-errors" class="dl-errors hidden"></div>

      <div class="dl-actions">
        <button id="btn-stop" class="btn danger hidden">&#9632; Stop</button>
        <button id="btn-back" class="btn secondary hidden">&#8592; Back to workspaces</button>
      </div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
